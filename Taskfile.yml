version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

vars:
  APP_NAME: "postly"
  BIN_DIR: "build/bin"
  VITE_PORT: '{{default 5173}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port 5173

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  # ── Windows-сборка (обход бага с вложенными includes) ──────────────────────

  build:win:
    summary: "Собирает postly.exe для Windows (требует MSYS2 + opus)"
    cmds:
      - wails3 generate bindings
      - cmd: cd frontend && npm install && npm run build
      # generate syso убран: конфликт ресурсов с webview2 (duplicate manifest/icons)
      # Иконка в установщике берётся из NSIS, не из .syso
      - mkdir -p {{.BIN_DIR}}
      - go build -tags production -trimpath -ldflags="-w -s -H windowsgui" -o {{.BIN_DIR}}/postly.exe .
      # Go перезаписывает PE StackReserve своим значением (обычно 1–2 МБ) уже ПОСЛЕ GCC,
      # поэтому CGO_LDFLAGS/extldflags не помогают. Патчим заголовок напрямую:
      # 128 МБ reserve + 4 МБ commit — достаточно для miniaudio/malgo init на Windows.
      - go run ./build/windows/setstack/main.go {{.BIN_DIR}}/postly.exe 134217728 4194304
    env:
      CGO_ENABLED: "1"
      # MSYS2 MINGW64 — единственный надёжный источник opus + opusfile на Windows
      # Установка: pacman -S mingw-w64-x86_64-gcc mingw-w64-x86_64-opus mingw-w64-x86_64-libopusfile mingw-w64-x86_64-pkg-config
      PKG_CONFIG_PATH: "C:/msys64/mingw64/lib/pkgconfig"
      CGO_CFLAGS: "-IC:/msys64/mingw64/include"
      # lopusfile зависит от lopus и logg — все линкуем статически.
      CGO_LDFLAGS: "-LC:/msys64/mingw64/lib -Wl,-Bstatic -lopusfile -lopus -logg -Wl,-Bdynamic -static-libgcc"

  build:win:noaudio:
    summary: "Тест без malgo/opus — диагностика STATUS_STACK_OVERFLOW"
    cmds:
      - go build -tags "production noaudio" -trimpath -ldflags="-w -s -H windowsgui" -o {{.BIN_DIR}}/postly-noaudio.exe .
    env:
      CGO_ENABLED: "0"

  package:win:
    summary: "Собирает NSIS-установщик postly-amd64-installer.exe (требует NSIS)"
    cmds:
      - task: build:win
      - wails3 generate webview2bootstrapper -dir build/windows/nsis
      - cmd: >-
          powershell -NoProfile -Command
          "& makensis
          ('/DARG_WAILS_AMD64_BINARY=' + (Resolve-Path 'build\bin\postly.exe'))
          (Resolve-Path 'build\windows\nsis\project.nsi')"
        platforms: [windows]
      - cmd: |
          makensis "-DARG_WAILS_AMD64_BINARY={{.ROOT_DIR}}/build/bin/postly.exe" "{{.ROOT_DIR}}/build/windows/nsis/project.nsi"
        platforms: [linux, darwin]
