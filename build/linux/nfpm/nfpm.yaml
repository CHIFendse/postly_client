# nfpm.yaml — конфиг для создания DEB / RPM / Arch-пакетов через nfpm.
# Документация: https://nfpm.goreleaser.com
# Использование:
#   task linux:create:deb   → .deb (Debian/Ubuntu)
#   task linux:create:rpm   → .rpm (Fedora/RHEL/AlmaLinux)
#   task linux:create:aur   → пакет для Arch Linux

name: "postly"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "net"
priority: "optional"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Postly — мессенджер с голосовым чатом"
vendor: "Postly"
homepage: "https://github.com/CHIFendse/postly"
license: "MIT"
release: "1"

contents:
  - src: "./build/bin/postly"
    dst: "/usr/local/bin/postly"
    file_info:
      mode: 0755

  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/postly.png"

  - src: "./build/linux/postly.desktop"
    dst: "/usr/share/applications/postly.desktop"

# ── Зависимости для DEB (Ubuntu 24.04+ / Debian Trixie+) ─────────────────────
# apt автоматически установит их при инсталляции пакета командой:
#   sudo apt install ./postly_0.1.0_amd64.deb
depends:
  - libgtk-4-1          # GTK4 runtime
  - libwebkitgtk-6.0-4  # WebKitGTK-6.0 runtime (требует Wails v3 на Linux)
  - libopus0            # Opus codec (голосовой чат)
  - libopusfile0        # OpusFile

# ── Переопределения зависимостей для конкретных форматов ─────────────────────
overrides:
  # RPM — Fedora 40+ / RHEL 9+ / AlmaLinux 9+
  rpm:
    depends:
      - gtk4             # GTK4 runtime
      - webkitgtk6.0     # WebKitGTK-6.0 runtime
      - opus             # Opus codec

  # Arch Linux (rolling release)
  archlinux:
    depends:
      - gtk4             # GTK4 runtime
      - webkitgtk-6.0    # WebKitGTK-6.0 runtime
      - opus             # Opus codec

# ── Скрипты после установки ───────────────────────────────────────────────────
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
