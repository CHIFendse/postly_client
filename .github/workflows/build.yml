name: Build AppImage

on:
  push:
    tags:
      - "v*"   # запускается когда ты делаешь git tag v1.0.0

jobs:
  build:
    runs-on: ubuntu-22.04   # важно: именно 22.04, не новее

    steps:
      - uses: actions/checkout@v4

      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установка системных библиотек
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libopus-dev libopusfile-dev

      - name: Установка Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Генерация биндингов
        run: wails3 generate bindings

      - name: Сборка фронтенда
        run: |
          cd frontend
          npm install
          npm run build

      - name: Сборка приложения
        run: go build -ldflags="-w -s" -o build/bin/postly .

      - name: Скачиваем linuxdeploy
        run: |
          curl -Lo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy

      - name: Упаковка в AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp build/bin/postly AppDir/usr/bin/

          cat > AppDir/usr/share/applications/postly.desktop << EOF
          [Desktop Entry]
          Name=Postly
          Exec=postly
          Icon=postly
          Type=Application
          Categories=Utility;
          EOF

          cp build/appicon.png AppDir/usr/share/icons/hicolor/256x256/apps/postly.png

          ./linuxdeploy --appdir AppDir --output appimage

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          files: "*.AppImage"