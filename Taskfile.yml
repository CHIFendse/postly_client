version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

vars:
  APP_NAME: "postly"
  BIN_DIR: "build/bin"
  VITE_PORT: '{{default 5173}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port 5173

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  # ── Windows-сборка (обход бага с вложенными includes) ──────────────────────

  build:win:
    summary: "Собирает postly.exe для Windows (требует MSYS2 + opus)"
    cmds:
      - wails3 generate bindings
      - cmd: cd frontend && npm install && npm run build
      - cmd: cd build && wails3 generate syso -arch amd64 -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_amd64.syso
      - go build -tags production -trimpath -ldflags="-w -s -H windowsgui" -o {{.BIN_DIR}}/postly.exe .
      - cmd: powershell -Command "Remove-Item wails_windows_amd64.syso -ErrorAction SilentlyContinue"
        platforms: [windows]
      - cmd: rm -f wails_windows_amd64.syso
        platforms: [linux, darwin]
    env:
      CGO_ENABLED: "1"
      PKG_CONFIG_PATH: 'C:\msys64\mingw64\lib\pkgconfig'
      CGO_CFLAGS: "-IC:/msys64/mingw64/include"
      CGO_LDFLAGS: "-LC:/msys64/mingw64/lib -Wl,-Bstatic -lopus -Wl,-Bdynamic -static-libgcc"

  package:win:
    summary: "Собирает NSIS-установщик postly-amd64-installer.exe (требует NSIS)"
    cmds:
      - task: build:win
      - wails3 generate webview2bootstrapper -dir build/windows/nsis
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File build/windows/build-installer.ps1
        platforms: [windows]
      - cmd: |
          root=$(pwd)
          cd build/windows/nsis
          makensis -DARG_WAILS_AMD64_BINARY="$root/build/bin/postly.exe" project.nsi
        platforms: [linux, darwin]
